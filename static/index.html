<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M5 v2 Context Engine | Enterprise Codebase Testing Dashboard</title>
  
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- React 18 + Babel + Lucide Icons + Marked -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-primary: #070913;
      --bg-secondary: #0d1224;
      --bg-card: rgba(18, 24, 46, 0.75);
      --bg-card-hover: rgba(28, 37, 68, 0.85);
      --border: rgba(99, 102, 241, 0.2);
      --border-focus: rgba(99, 102, 241, 0.6);
      --accent: #6366f1;
      --accent-gradient: linear-gradient(135deg, #6366f1 0%, #06b6d4 100%);
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      background-image: 
        radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
    }

    /* Glassmorphism Classes */
    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Header */
    header {
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(7, 9, 19, 0.8);
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-badge {
      background: var(--accent-gradient);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      color: #fff;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 500;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }

    /* Layout */
    .container {
      max-width: 1280px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 960px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* Sidebar controls */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    input[type="text"], textarea {
      width: 100%;
      background: rgba(13, 18, 36, 0.8);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input[type="text"]:focus, textarea:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
    }

    .btn {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: #fff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .stat-box {
      background: rgba(13, 18, 36, 0.6);
      border-radius: 8px;
      padding: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: 0.75rem;
    }

    .stat-val {
      font-family: var(--font-mono);
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Preset Chips */
    .chip-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.8rem;
      color: #d1d5db;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .chip:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.4);
      color: #fff;
    }

    /* Chat Area */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 780px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .message {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: 90%;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
    }

    .message.assistant {
      align-self: flex-start;
      max-width: 95%;
      width: 100%;
    }

    .msg-bubble {
      padding: 1rem 1.25rem;
      border-radius: 12px;
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .user .msg-bubble {
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 2px;
    }

    .assistant .msg-bubble {
      background: rgba(13, 18, 36, 0.9);
      border: 1px solid var(--border);
      border-bottom-left-radius: 2px;
    }

    /* Markdown Styling Inside Bubble */
    .msg-bubble pre {
      background: #050711;
      padding: 0.85rem 1rem;
      border-radius: 8px;
      overflow-x: auto;
      margin: 0.75rem 0;
      border: 1px solid rgba(255, 255, 255, 0.08);
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    .msg-bubble code {
      font-family: var(--font-mono);
      background: rgba(255, 255, 255, 0.08);
      padding: 0.15rem 0.35rem;
      border-radius: 4px;
      font-size: 0.85rem;
      color: var(--accent-cyan);
    }

    .msg-bubble h1, .msg-bubble h2, .msg-bubble h3 {
      margin: 0.75rem 0 0.4rem 0;
      color: #fff;
    }

    .msg-bubble ul, .msg-bubble ol {
      padding-left: 1.4rem;
      margin: 0.5rem 0;
    }

    .msg-bubble p {
      margin-bottom: 0.5rem;
    }

    /* Chat Input Form */
    .chat-input-panel {
      padding: 1.25rem;
      border-top: 1px solid var(--border);
      background: rgba(10, 14, 29, 0.7);
    }

    .input-wrapper {
      display: flex;
      gap: 0.75rem;
    }

    .chat-textarea {
      flex: 1;
      resize: none;
      height: 48px;
      font-family: var(--font-sans);
    }

    .chat-submit-btn {
      width: auto;
      padding: 0 1.5rem;
      height: 48px;
    }

    /* Loader Spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SAMPLE_QUERIES = [
      "Where is AST block parsing implemented and what languages does it support?",
      "How does the VectorStore generate deterministic UUIDv5 point IDs?",
      "Explain how the ReAct loop executes tools and parses action JSON.",
      "What local dependencies does src/server.py import?"
    ];

    function App() {
      const [workspaceRoot, setWorkspaceRoot] = useState(".");
      const [indexing, setIndexing] = useState(false);
      const [indexedCount, setIndexedCount] = useState(33);
      const [indexStatus, setIndexStatus] = useState("Idle");

      const [messages, setMessages] = useState([
        {
          role: "assistant",
          content: "👋 **M5 v2 Engine Ready.** Ask any question about your codebase architecture, tools, AST parser, or vector index."
        }
      ]);
      const [inputQuery, setInputQuery] = useState("");
      const [loading, setLoading] = useState(false);
      const [healthStatus, setHealthStatus] = useState("Checking...");

      const messagesEndRef = useRef(null);

      useEffect(() => {
        // Check health
        fetch("/health")
          .then(res => res.json())
          .then(data => setHealthStatus(data.status === "online" ? "Online (Qdrant Active)" : "Error"))
          .catch(() => setHealthStatus("Offline"));
      }, []);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages]);

      // Trigger Indexing
      const handleIndex = async () => {
        setIndexing(true);
        setIndexStatus("Scanning & embedding AST blocks...");
        try {
          const res = await fetch("/api/index", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ workspace_root: workspaceRoot })
          });
          const data = await res.json();
          if (res.ok) {
            setIndexedCount(data.blocks_indexed);
            setIndexStatus(`Indexed ${data.blocks_indexed} blocks successfully.`);
          } else {
            setIndexStatus(`Error: ${data.detail}`);
          }
        } catch (err) {
          setIndexStatus("Failed to connect to index endpoint.");
        } finally {
          setIndexing(false);
        }
      };

      // Send Chat Query
      const handleSend = async (queryText) => {
        const query = queryText || inputQuery;
        if (!query.trim() || loading) return;

        const userMsg = { role: "user", content: query };
        setMessages(prev => [...prev, userMsg]);
        setInputQuery("");
        setLoading(true);

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query, max_turns: 5 })
          });
          const data = await res.json();
          if (res.ok) {
            setMessages(prev => [...prev, { role: "assistant", content: data.answer }]);
          } else {
            setMessages(prev => [...prev, { role: "assistant", content: `❌ Error: ${data.detail || "Server error"}` }]);
          }
        } catch (err) {
          setMessages(prev => [...prev, { role: "assistant", content: "❌ Network error: Unable to reach M5 v2 API." }]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div>
          {/* Header */}
          <header>
            <div className="logo-container">
              <div className="logo-badge">M5 v2</div>
              <div className="brand-title">Context & Memory Engine</div>
            </div>
            <div className="status-badge">
              <span className="status-dot"></span>
              {healthStatus}
            </div>
          </header>

          {/* Main Dashboard Layout */}
          <div className="container">
            {/* Sidebar Controls */}
            <div className="sidebar">
              {/* Ingestion Panel */}
              <div className="glass-panel" style={{ padding: "1.25rem" }}>
                <div className="card-title">📁 Workspace Ingestion</div>
                <div className="form-group">
                  <label>Repository Path</label>
                  <input 
                    type="text" 
                    value={workspaceRoot} 
                    onChange={e => setWorkspaceRoot(e.target.value)} 
                    placeholder="."
                  />
                </div>
                <button 
                  className="btn btn-primary" 
                  onClick={handleIndex} 
                  disabled={indexing}
                >
                  {indexing ? <><span className="spinner"></span> Indexing AST...</> : "⚡ Re-Index Codebase"}
                </button>
                <div className="stat-box">
                  <div className="stat-val">{indexedCount}</div>
                  <div className="stat-label">AST Blocks in Vector Index</div>
                </div>
                <div style={{ fontSize: "0.75rem", color: "#9ca3af", marginTop: "0.5rem" }}>
                  Status: {indexStatus}
                </div>
              </div>

              {/* Sample Queries */}
              <div className="glass-panel" style={{ padding: "1.25rem" }}>
                <div className="card-title">💡 Example Code Queries</div>
                <div className="chip-container">
                  {SAMPLE_QUERIES.map((q, idx) => (
                    <div 
                      key={idx} 
                      className="chip" 
                      onClick={() => handleSend(q)}
                    >
                      {q}
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Chat & Reasoning Playground */}
            <div className="glass-panel chat-container">
              <div className="chat-messages">
                {messages.map((msg, idx) => (
                  <div key={idx} className={`message ${msg.role}`}>
                    <div 
                      className="msg-bubble"
                      dangerouslySetInnerHTML={{ __html: marked.parse(msg.content) }}
                    />
                  </div>
                ))}
                {loading && (
                  <div className="message assistant">
                    <div className="msg-bubble" style={{ display: "flex", alignItems: "center", gap: "0.5rem" }}>
                      <span className="spinner"></span>
                      <span>Agent reasoning with AST Vector Store & Dependency Graph...</span>
                    </div>
                  </div>
                )}
                <div ref={messagesEndRef} />
              </div>

              {/* Chat Input */}
              <div className="chat-input-panel">
                <form 
                  onSubmit={(e) => { e.preventDefault(); handleSend(); }}
                  className="input-wrapper"
                >
                  <input
                    type="text"
                    className="chat-textarea"
                    placeholder="Ask about functions, classes, dependencies, or codebase logic..."
                    value={inputQuery}
                    onChange={(e) => setInputQuery(e.target.value)}
                    disabled={loading}
                  />
                  <button 
                    type="submit" 
                    className="btn btn-primary chat-submit-btn" 
                    disabled={loading || !inputQuery.trim()}
                  >
                    {loading ? <span className="spinner"></span> : "Send"}
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
