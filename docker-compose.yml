
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: m5-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # Qdrant REST API & Web Dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # Qdrant gRPC
    environment:
      - QDRANT__LOG_LEVEL=INFO
    volumes:
      - qdrant_storage:/qdrant/storage:z
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 3s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  m5-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: m5-engine:v3.1
    container_name: m5-engine
    restart: unless-stopped
    ports:
      - "8000:8000" # M5 Context API & Remote MCP (http://localhost:8000/mcp)
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - PYTHONUNBUFFERED=1
      - AUTO_INDEX=${AUTO_INDEX:-true}
    volumes:
      - "./storage:/app/storage"
      - "${WORKSPACE_ROOT:-.}:/workspace"
    depends_on:
      qdrant:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qdrant_storage:
    driver: local
