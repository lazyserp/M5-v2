version: '3.8'

networks:
  m5_network:
    driver: bridge

services:
  # 1 Vector Database Service
  qdrant:
    image: qdrant/qdrant:latest
    container_name: m5_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    networks:
      - m5_network

  #  M5 v2 Core Engine Service
  m5_engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: m5_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MODEL_ID=gemini-3.6-flash
    volumes:
      - ./:/app
    depends_on:
      - qdrant
    networks:
      - m5_network

  #  Optional Local LLM Container 
  ollama:
    image: ollama/ollama:latest
    container_name: m5_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_models:/root/.ollama
    networks:
      - m5_network
    profiles: ["local-ai"]
